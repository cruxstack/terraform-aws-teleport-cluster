name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bump Version
        id: tag_version
        uses: cruxstack/gh-create-semver-tag-action@81a68a34ab1fb48f4568ddd10e76caf9a608108e # v1.0.0
        with:
          bump-default: minor
          bump-rules: bug:patch:Fixes,chore:patch:Chores,docs:patch:Documentation,feat:minor:Features,refactor:minor:Refactors,test:patch:Tests,ci:patch:Development,dev:patch:Development
      - name: Create Release
        if: steps.tag_version.outputs.tag != ''
        uses: cruxstack/gh-create-release-action@3a56a12ce0c6e8083dc90eb7f77805d72423b3fe # v1.0.0
        with:
          release-tag: ${{ steps.tag_version.outputs.tag }}
          release-body: ${{ steps.tag_version.outputs.changelog }}
          release-if-exists: skip
